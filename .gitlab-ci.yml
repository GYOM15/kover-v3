image: registry.gitlab.info.uqam.ca/inf31351/docker/base

before_script:
  - apt-get update
  - apt-get install -y bats libcairo2-dev

stages:
  - build
  - test

build:
  stage: build
  script:
    - make build
  artifacts:
    paths:
      - bin/kover

test:
  stage: test
  script:
    - make test
